<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habib Perfume Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1A1A1A 50%, #0d0d0d 100%);
            color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de partículas/brilhos de fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 70%, rgba(139, 0, 0, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 550px;
            padding: 50px 45px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(139, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(139, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            font-size: 4em;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, #F5F5F5 0%, #C0C0C0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1.15em;
            margin-bottom: 40px;
            opacity: 0.8;
            color: #B0B0B0;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B0000 0%, #5A0000 100%);
            font-size: 1.3em;
            padding: 20px 50px;
            box-shadow: 
                0 8px 25px rgba(139, 0, 0, 0.4),
                0 0 20px rgba(139, 0, 0, 0.2);
            border: 1px solid rgba(139, 0, 0, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 35px rgba(139, 0, 0, 0.5),
                0 0 30px rgba(139, 0, 0, 0.3);
            background: linear-gradient(135deg, #A00000 0%, #8B0000 100%);
        }

        .btn-secondary {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(139, 0, 0, 0.4);
            color: #E0E0E0;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(139, 0, 0, 0.25);
            border-color: rgba(139, 0, 0, 0.6);
            transform: translateY(-2px);
            color: #F5F5F5;
        }

        .footer-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-icon">🌸</div>
        <h1>Habib Perfume Shop</h1>
        <p class="tagline">Descubra fragrâncias únicas e elegantes</p>

        <div class="buttons">
            <a href="login/login.html" class="btn btn-primary">
                <span>✨</span> Entrar
            </a>
            <a href="login/login.html?cadastro=true" class="btn btn-secondary">
                <span>📝</span> Criar Conta
            </a>
        </div>
    </div>
    
    <p class="footer-text">© 2025 Habib Perfume Shop</p>

</body>

</html>
