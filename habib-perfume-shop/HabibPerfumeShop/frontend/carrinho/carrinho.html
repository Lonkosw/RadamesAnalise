<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho de Compras</title>
  <link rel="stylesheet" href="../common/crud.css">
  <style>
    .carrinho-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .carrinho-vazio { text-align: center; padding: 60px 20px; color: #666; }
    .carrinho-vazio h2 { margin-bottom: 10px; }
    .carrinho-item { display: grid; grid-template-columns: 80px 1fr auto auto auto; gap: 16px; align-items: center; padding: 16px; background: #fff; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .carrinho-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #f0f0f0; }
    .carrinho-item .info h3 { margin: 0 0 4px; font-size: 1rem; }
    .carrinho-item .info p { margin: 0; color: #666; font-size: .85rem; }
    .carrinho-item .quantidade { display: flex; align-items: center; gap: 8px; }
    .carrinho-item .quantidade button { width: 28px; height: 28px; border: none; background: #ddd; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .carrinho-item .quantidade button:hover { background: #ccc; }
    .carrinho-item .quantidade span { min-width: 30px; text-align: center; font-weight: 600; }
    .carrinho-item .preco { font-weight: 700; color: #1a6b2d; font-size: 1.1rem; min-width: 100px; text-align: right; }
    .carrinho-item .remover { background: #dc3545; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: .8rem; }
    .carrinho-item .remover:hover { background: #c82333; }
    .carrinho-resumo { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-top: 20px; }
    .carrinho-resumo .linha { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .carrinho-resumo .total { font-size: 1.3rem; font-weight: 700; border-top: 2px solid #eee; padding-top: 10px; margin-top: 10px; }
    .carrinho-resumo .total .valor { color: #1a6b2d; }
    .btn-finalizar { width: 100%; padding: 14px; background: #1a6b2d; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .btn-finalizar:hover { background: #145424; }
    .btn-finalizar:disabled { background: #ccc; cursor: not-allowed; }
    .btn-continuar { display: block; text-align: center; margin-top: 12px; color: #23518a; text-decoration: none; }
    @media (max-width: 600px) {
      .carrinho-item { grid-template-columns: 60px 1fr; gap: 10px; }
      .carrinho-item .quantidade, .carrinho-item .preco, .carrinho-item .remover { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="carrinho-container">
    <h1>🛒 Carrinho de Compras</h1>
    <div id="feedback" class="feedback" hidden></div>
    
    <div id="listaCarrinho"></div>
    
    <div id="resumo" class="carrinho-resumo" hidden>
      <div class="linha">
        <span>Subtotal (<span id="qtdItens">0</span> itens)</span>
        <span id="subtotal">R$ 0,00</span>
      </div>
      <div class="linha total">
        <span>Total</span>
        <span class="valor" id="totalValor">R$ 0,00</span>
      </div>
      <button class="btn-finalizar" id="btnFinalizar">Finalizar Compra</button>
      <a href="/menu" class="btn-continuar">← Continuar Comprando</a>
    </div>
  </div>

  <script src="./carrinho.js"></script>
  <script src="../common/simpleHeader.js" defer></script>
</body>
</html>
