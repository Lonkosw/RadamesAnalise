<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargos - Habib Perfume Shop</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="cargo.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      <nav class="header-nav">
        <a href="/menu">🏠 Início</a>
        <span class="usuario-info">
          <span id="nomeUsuario">Gerente</span>
          <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Título da página -->
    <div class="page-header">
      <h1>📋 Gerenciar Cargos</h1>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="filtro" class="form-control" placeholder="🔍 Buscar por nome do cargo..." style="min-width: 250px;">
        <button id="btnBuscar" class="btn btn-primary">Buscar</button>
        <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
      </div>
      <div class="toolbar-right">
        <button id="btnNovo" class="btn btn-success">+ Novo Cargo</button>
        <button id="btnRecarregar" class="btn btn-secondary">↻ Atualizar</button>
      </div>
    </div>

    <!-- Feedback -->
    <div id="feedback" class="alert hidden"></div>

    <!-- Tabela -->
    <div class="table-container">
      <div class="table-responsive">
        <table class="table" id="tabela">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome do Cargo</th>
              <th style="width: 150px; text-align: center;">Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dados dinâmicos -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulário -->
    <section id="secForm" class="card hidden" style="margin-top: 24px;">
      <div class="card-header">
        <h2 id="tituloForm">Novo Cargo</h2>
      </div>
      <div class="card-body">
        <form id="formRegistro" autocomplete="off">
          <input type="hidden" id="idCargo">
          <div class="form-group">
            <label for="nome_cargo">Nome do Cargo <span class="required">*</span></label>
            <input type="text" id="nome_cargo" name="nome_cargo" class="form-control" required placeholder="Ex: Gerente, Vendedor, Caixa...">
          </div>
          <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" class="btn btn-primary" id="btnSalvar">💾 Salvar</button>
            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btnExcluir" hidden>🗑️ Excluir</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <script src="cargo.js"></script>
</body>
</html>
