<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pedido</title>
    <link rel="stylesheet" href="./pesquisaDinamicaStyle.css">
    <link rel="stylesheet" href="./pedido.css">
</head>

<body>
    <header>
        <h1>🌸 CRUD Pedido - Habib Perfume Shop</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Pedido</h2>

            <form id="pedidoForm">
                <div class="search-container">
                    <label for="searchId">Buscar por ID:</label>
                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary" style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados do Pedido</legend>

                    <div class="form-group">
                        <input type="date" id="data_pedido" name="data_pedido" required>

                        <div class="search-bar-container">
                            <select id="searchType" class="search-select">
                                <option value="cpf">CPF</option>
                                <option value="nome">Nome</option>
                            </select>
                            <input type="text" id="cliente_cpf" name="cliente_cpf"
                                placeholder="CPF cliente..." onfocus="buscaDinamica()">
                            <ul id="resultsList" class="results-list"></ul>
                        </div>

                        <input type="text" id="funcionario_cpf" name="funcionario_cpf"
                            placeholder="CPF funcionário (opcional)...">
                    </div>

                    <div class="form-group status-group">
                        <label for="status_pedido">Status:</label>
                        <select id="status_pedido" name="status_pedido" class="status-select">
                            <option value="pendente">⏳ Aguardando Pagamento</option>
                            <option value="pago">✅ Pago</option>
                        </select>
                    </div>
                </fieldset>
            </form>

            <div class="itensDoPedido">
                <div class="itens-header">
                    <span>Itens do Pedido</span>
                    <button type="button" id="btnAdicionarItem" onclick="adicionarItem()"
                        class="btn-secondary btn-small">➕ Adicionar Item</button>
                </div>
                <div class="item-table-container">
                    <table id="itensTable">
                        <thead>
                            <tr>
                                <th>ID Pedido</th>
                                <th>ID Produto</th>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Preço Unitário</th>
                                <th>Subtotal</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="itensTableBody">
                            <!-- Itens serão carregados dinamicamente -->
                        </tbody>
                        <tfoot>
                            <tr class="total-row">
                                <td colspan="5" style="text-align: right;"><strong>Total do Pedido:</strong></td>
                                <td id="totalPedido"><strong>R$ 0,00</strong></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2025 Habib Perfume Shop - CRUD Pedido</p>
        <a href="/menu" class="btn-voltar">← Voltar ao Menu</a>
    </footer>

    <div id="messageContainer" class="message-container"></div>
    <script src="./pesquisaDinamicaCliente.js"></script>
    <script src="./pedido.js" defer></script>

</body>

</html>
