<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Habib Perfume Shop</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="pagamento.css">
</head>
<body>
    <!-- Header Padrão -->
    <header class="header-padrao">
        <div class="header-content">
            <a href="../index.html" class="logo">🌸 Habib Perfume Shop</a>
            <nav class="nav-menu">
                <a href="../index.html">Início</a>
                <a href="../carrinho/carrinho.html">Carrinho</a>
                <a href="../pedidos/pedidos.html">Meus Pedidos</a>
            </nav>
            <div class="usuario-info">
                <span id="nomeUsuario">Cliente</span>
                <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <section class="card resumo-pedido">
            <div class="card-header">
                <h2>💳 Resumo do Pedido</h2>
            </div>
            <div class="card-body">
                <div class="info-pedido">
                    <p>Pedido: <strong id="numero-pedido">#---</strong></p>
                </div>
                <div class="valor-row">
                    <span>Valor Total:</span>
                    <span id="valor-total" class="valor">R$ 0,00</span>
                </div>
                <div class="valor-row valor-restante">
                    <span>Valor Restante:</span>
                    <span id="valor-restante" class="valor">R$ 0,00</span>
                </div>
            </div>
        </section>

        <section class="card formas-pagamento">
            <div class="card-header">
                <h2>Formas de Pagamento</h2>
            </div>
            <div class="card-body">
                <div class="selecao-pagamento">
                    <label for="forma-pagamento">Adicionar Forma de Pagamento:</label>
                    <select id="forma-pagamento" class="form-control">
                        <option value="">Selecione uma forma de pagamento</option>
                    </select>
                    <button type="button" id="btn-adicionar" class="btn btn-success">+ Adicionar</button>
                </div>

                <form id="form-pagamento">
                    <div id="formas-adicionadas" class="formas-adicionadas">
                        <!-- As formas de pagamento serão adicionadas aqui dinamicamente -->
                    </div>

                    <button type="submit" id="btn-finalizar" class="btn btn-primary btn-lg btn-block" disabled>
                        ✅ Finalizar Pagamento
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer Padrão -->
    <footer class="footer-padrao">
        <p>&copy; 2024 Habib Perfume Shop - Todos os direitos reservados</p>
    </footer>

    <script src="pagamento.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('usuario');
            localStorage.removeItem('token');
            window.location.href = '/login';
        }
        
        // Carregar nome do usuário
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
            const nomeEl = document.getElementById('nomeUsuario');
            if (nomeEl && usuario.nome) {
                nomeEl.textContent = usuario.nome;
            }
        });
    </script>
</body>
</html>
