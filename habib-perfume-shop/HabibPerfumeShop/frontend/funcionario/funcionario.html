<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funcionários - Habib Perfume Shop</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="funcionario.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      <nav class="header-nav">
        <a href="/menu">🏠 Início</a>
        <span class="usuario-info">
          <span id="nomeUsuario">Gerente</span>
          <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Título da página -->
    <div class="page-header">
      <h1>👔 Gerenciar Funcionários</h1>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="filtro" class="form-control" placeholder="🔍 Buscar por CPF, nome, cargo ou email..." style="min-width: 300px;">
        <button id="btnBuscar" class="btn btn-primary">Buscar</button>
        <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
      </div>
      <div class="toolbar-right">
        <button id="btnNovo" class="btn btn-success">+ Novo Funcionário</button>
        <button id="btnRecarregar" class="btn btn-secondary">↻ Atualizar</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-container">
      <div class="table-responsive" id="tb">
        <table class="table">
          <thead>
            <tr>
              <th>CPF</th>
              <th>Nome</th>
              <th>Cargo</th>
              <th>Cargo (Sistema)</th>
              <th>Salário</th>
              <th>Comissão (%)</th>
              <th>Email</th>
              <th style="width: 120px; text-align: center;">Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Formulário -->
    <section id="painel" class="card hidden" style="margin-top: 24px;">
      <div class="card-header">
        <h2 id="formTitulo">Novo Funcionário</h2>
      </div>
      <div class="card-body">
        <form id="form" autocomplete="off">
          <input type="hidden" id="cpfOriginal">
          <div class="form-row">
            <div class="form-group">
              <label for="cpf">CPF <span class="required">*</span></label>
              <input type="text" id="cpf" name="cpf" class="form-control" maxlength="11" required pattern="\d{11}" inputmode="numeric" placeholder="12345678901">
            </div>
            <div class="form-group">
              <label for="nome">Nome <span class="required">*</span></label>
              <input type="text" id="nome" name="nome" class="form-control" required placeholder="Nome completo">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cargo">Cargo <span class="required">*</span></label>
              <select id="cargo" name="cargo" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label for="salario">Salário (R$)</label>
              <input type="number" id="salario" name="salario" class="form-control" step="0.01" min="0" max="99999999.99" placeholder="0.00">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="porcentagem_comissao">Comissão (%)</label>
              <input type="number" id="porcentagem_comissao" name="porcentagem_comissao" class="form-control" step="0.01" min="0" max="100" placeholder="0.00">
            </div>
            <div class="form-group">
              <label for="email">Email <span class="required">*</span></label>
              <input type="email" id="email" name="email" class="form-control" required placeholder="email@exemplo.com">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" class="form-control" minlength="4" placeholder="••••••••">
              <small id="senhaHelp" class="form-hint">Deixe em branco para manter a senha atual.</small>
            </div>
          </div>
          <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">💾 Salvar</button>
            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            <button type="button" id="btnExcluir" class="btn btn-danger" hidden>🗑️ Excluir</button>
          </div>
        </form>
        <div id="status" class="alert hidden" style="margin-top: 16px;"></div>
      </div>
    </section>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <script>
    const API='/funcionario';
    const CARGOS_BASE = ['Gerente','Vendedor','Caixa','Atendente','Estoquista'];
    async function fetchJson(url, opts){ const r=await fetch(url, opts); if(!r.ok) throw await r.json().catch(()=>({error:'Erro'})); return r.json(); }
    function el(q){ return document.querySelector(q); }
    function fmt(v){ return v!=null? Number(v).toFixed(2):'' }
    function showFeedback(msg, type='error') {
      const s = el('#status');
      s.textContent = msg;
      s.className = 'alert alert-' + (type === 'success' ? 'success' : 'danger');
      s.classList.remove('hidden');
      setTimeout(() => s.classList.add('hidden'), 4000);
    }
    async function carregar(q){
      const url = q? `${API}?q=${encodeURIComponent(q)}`: API;
      const data = await fetchJson(url,{credentials:'include'});
      const tbody = el('#tb tbody'); tbody.innerHTML='';
      (data||[]).forEach(f=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${f.cpf}</td><td>${f.nome||''}</td><td>${f.cargo||''}</td><td>${f.nome_cargo||'-'}</td><td>R$ ${fmt(f.salario)}</td><td>${f.porcentagem_comissao!=null? Number(f.porcentagem_comissao).toFixed(2)+'%':''}</td><td>${f.email||''}</td><td style="text-align:center"><button class="btn btn-sm btn-warning" data-editar='${f.cpf}'>✏️ Editar</button></td>`;
        tbody.appendChild(tr);
      });

      // Popular o select de cargos a partir da base + cargos existentes, removendo "Gerente Master"
      const cargos = new Set(CARGOS_BASE);
      (data||[]).forEach(f=>{ if(f.cargo) cargos.add(String(f.cargo)); });
      cargos.delete('Gerente Master');
      const select = el('#cargo');
      if (select) {
        const current = select.value;
        select.innerHTML = '';
        [...cargos].forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; select.appendChild(o); });
        if(current && [...cargos].includes(current)) select.value=current;
      }
    }
    async function obter(cpf){ return fetchJson(`${API}/${cpf}`,{credentials:'include'}); }
    async function criar(payload){ return fetchJson(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)}); }
    async function atualizar(cpf,payload){ return fetchJson(`${API}/${cpf}`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)}); }
    async function excluir(cpf){ const r=await fetch(`${API}/${cpf}`,{method:'DELETE',credentials:'include'}); if(!r.ok) throw await r.json().catch(()=>({error:'Erro'})); }

    document.addEventListener('DOMContentLoaded',()=>{
      const filtro = el('#filtro');
      el('#btnBuscar').onclick=()=> carregar(filtro.value.trim());
      el('#btnLimpar').onclick=()=>{ filtro.value=''; carregar(); };
      el('#btnRecarregar').onclick=()=> carregar(filtro.value.trim());
      carregar();

      // Novo
      el('#btnNovo').onclick=()=>{
        el('#formTitulo').textContent='Novo Funcionário';
        el('#form').reset();
        el('#cpf').readOnly=false;
        const cpfOrig = el('#cpfOriginal'); if(cpfOrig) cpfOrig.value='';
        el('#btnExcluir').hidden=true;
        el('#painel').classList.remove('hidden');
        el('#senha').required=true;
        el('#senhaHelp').textContent='Defina uma senha para o novo funcionário.';
      };

      // Cancelar
      el('#btnCancelar').onclick=()=> el('#painel').classList.add('hidden');

      // Editar
      el('#tb').addEventListener('click', async e=>{
        const btn = e.target.closest('button[data-editar]'); if(!btn) return;
        let d; try{ d = await obter(btn.getAttribute('data-editar')); }catch(err){ showFeedback((err&&err.error)||'Erro ao carregar funcionário', 'error'); return; }
        el('#formTitulo').textContent='Editar Funcionário';
        el('#painel').classList.remove('hidden'); el('#cpf').value=d.cpf; el('#cpf').readOnly=false;
        el('#cpfOriginal').value=d.cpf;
        el('#nome').value=d.nome||''; el('#cargo').value=d.cargo||''; el('#salario').value=d.salario!=null? d.salario:''; el('#porcentagem_comissao').value=d.porcentagem_comissao!=null? d.porcentagem_comissao:''; el('#email').value=d.email||''; el('#senha').value='';
        el('#senha').required=false; el('#senhaHelp').textContent='Deixe em branco para manter a senha atual.';
        el('#btnExcluir').hidden=false;
      });

      // Salvar
      el('#form').onsubmit = async ev=>{
        ev.preventDefault();
        const payload = Object.fromEntries(new FormData(el('#form')).entries());
        if(payload.salario==='') delete payload.salario; else payload.salario = Number(payload.salario);
        if(payload.porcentagem_comissao==='') delete payload.porcentagem_comissao; else payload.porcentagem_comissao = Number(payload.porcentagem_comissao);
        const cpf = el('#cpf').value.trim();
        try{
          if(el('#cpfOriginal').value){ // editar
            const cpfOriginal = el('#cpfOriginal').value.trim();
            if(payload.senha==='') delete payload.senha;
            if(cpf !== cpfOriginal){ payload.novo_cpf = cpf; }
            delete payload.cpf;
            await atualizar(cpfOriginal, payload);
          } else {
            await criar(payload);
          }
          showFeedback('✓ Salvo com sucesso!', 'success');
          await carregar(el('#filtro').value.trim()); el('#painel').classList.add('hidden');
        }catch(e){ showFeedback(e.error||'Erro ao salvar', 'error'); }
      };

      // Excluir
      el('#btnExcluir').onclick = async ()=>{
        const cpf = (el('#cpfOriginal').value || el('#cpf').value).trim(); if(!cpf) return;
        if(!confirm('Tem certeza que deseja excluir este funcionário?')) return;
        try{ await excluir(cpf); showFeedback('✓ Excluído com sucesso!', 'success'); await carregar(el('#filtro').value.trim()); el('#painel').classList.add('hidden'); }catch(e){ showFeedback(e.error||'Erro ao excluir', 'error'); }
      };
    });

    function logout() {
      document.cookie = 'usuarioLogado=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      window.location.href = '/login/login.html';
    }
  </script>
</body>
</html>
