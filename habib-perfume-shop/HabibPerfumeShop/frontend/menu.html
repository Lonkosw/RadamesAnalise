<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habib Perfume Shop - Menu Principal</title>
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/menu.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="/menu">🏠 Home</a></li>
        </ul>
      </nav>

      <div class="usuario-info">
        <span id="nomeUsuario">Carregando...</span>
        <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Catálogo de Produtos -->
    <section class="catalogo">
      <h2 class="sec-title">🌹 Nossos Perfumes</h2>
      <div id="produtosGrid" class="produtos-grid">
        <p class="text-muted text-center">Carregando produtos...</p>
      </div>
    </section>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <!-- Toast -->
  <div id="toast-box"></div>

  <script>
    const API_BASE_URL = 'http://localhost:3001';
    const navMenu = document.getElementById('navMenu');
    const grid = document.getElementById('produtosGrid');

    // ==================== MENUS ====================
    
    // Menu do CLIENTE
    const MENU_CLIENTE = [
      { label: '🏠 Home', href: '/menu' },
      { label: '🛒 Carrinho', href: '/visaoCliente/carrinho/carrinho.html' },
      { label: '📦 Meus Pedidos', href: '/visaoCliente/pedidos/pedidos.html' }
    ];

    // Menu do GERENTE (somente CRUDs permitidos)
    const MENU_GERENTE = [
      { label: '🏠 Home', href: '/menu' },
      { 
        label: '⚙️ Cadastros', 
        submenu: [
          { label: '📋 Cargos', href: '/cargo/abrirCrudCargo' },
          { label: '👔 Funcionários', href: '/funcionario/abrirCrudFuncionario' },
          { label: '👥 Clientes', href: '/cliente/abrirCrudCliente' },
          { label: '🧴 Produtos', href: '/produto/abrirCrudProduto' }
        ]
      },
      { 
        label: '📊 Relatórios', 
        submenu: [
          { label: '📈 Vendas por Período', href: '/relatorios/index.html' },
          { label: '🏆 Produtos Mais Vendidos', href: '/relatorios/index.html' }
        ]
      }
    ];

    // ==================== RENDER MENU ====================
    
    function renderMenu(usuario) {
      navMenu.innerHTML = '';
      
      let menuItems = [];
      
      if (!usuario) {
        menuItems = [{ label: '🏠 Home', href: '/menu' }];
      } else if (usuario.tipo === 'cliente') {
        menuItems = MENU_CLIENTE;
      } else if (usuario.tipo === 'funcionario') {
        menuItems = MENU_GERENTE;
      }

      menuItems.forEach(item => {
        const li = document.createElement('li');
        
        if (item.submenu) {
          li.innerHTML = `<a href="#">${item.label}</a>`;
          const ul = document.createElement('ul');
          ul.className = 'nav-submenu';
          item.submenu.forEach(sub => {
            const subLi = document.createElement('li');
            subLi.innerHTML = `<a href="${sub.href}">${sub.label}</a>`;
            ul.appendChild(subLi);
          });
          li.appendChild(ul);
        } else {
          li.innerHTML = `<a href="${item.href}">${item.label}</a>`;
        }
        
        navMenu.appendChild(li);
      });

      // Atualiza nome do usuário
      const nomeEl = document.getElementById('nomeUsuario');
      if (usuario) {
        nomeEl.textContent = `Olá, ${usuario.nome || usuario.tipo}`;
      } else {
        nomeEl.textContent = 'Visitante';
      }
    }

    // ==================== AUTENTICAÇÃO ====================
    
    let _usuarioCache = null;

    async function carregarUsuario() {
      try {
        const res = await fetch(API_BASE_URL + '/login/status', { credentials: 'include' });
        const data = await res.json();
        
        if (data.status === 'ok') {
          _usuarioCache = data.usuario;
          renderMenu(_usuarioCache);
          carregarProdutos();
        } else {
          window.location.href = '/login/login.html';
        }
      } catch (e) {
        console.error('Erro ao verificar login:', e);
        window.location.href = '/login/login.html';
      }
    }

    function logout() {
      document.cookie = 'usuarioLogado=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      window.location.href = '/login/login.html';
    }

    // ==================== PRODUTOS ====================
    
    async function carregarProdutos() {
      try {
        const r = await fetch(API_BASE_URL + '/produto');
        if (!r.ok) return;
        const lista = await r.json();
        
        grid.innerHTML = '';
        
        if (lista.length === 0) {
          grid.innerHTML = '<p class="text-muted text-center">Nenhum produto disponível</p>';
          return;
        }
        
        lista.forEach(p => grid.appendChild(cardProduto(p)));
      } catch (e) {
        console.error('Erro ao carregar produtos:', e);
        grid.innerHTML = '<p class="text-danger text-center">Erro ao carregar produtos</p>';
      }
    }

    function cardProduto(p) {
      const div = document.createElement('div');
      div.className = 'produto-card';
      
      const id = p.id_produto;
      const nome = p.nome_produto || p.nome || 'Sem nome';
      const preco = Number(p.preco_produto || p.preco || 0).toFixed(2).replace('.', ',');
      const marca = p.marca_produto || p.marca || '';
      const volume = p.volume_ml ? `${p.volume_ml} ml` : '';
      const concentracao = p.concentracao || '';
      
      div.innerHTML = `
        <div class="produto-img">
          <img src="/imagens-produtos/${id}.png" alt="${nome}" onerror="this.src='/imagens-produtos/default.png'">
        </div>
        <div class="produto-info">
          <h3 class="produto-nome" title="${nome}">${nome}</h3>
          <p class="produto-meta">${[marca, concentracao].filter(Boolean).join(' • ') || '&nbsp;'}</p>
          <p class="produto-volume">${volume}</p>
          <div class="produto-preco">R$ ${preco}</div>
          <div class="produto-acoes">
            <button class="btn btn-primary btn-sm" onclick="adicionarCarrinho(${id}, '${nome.replace(/'/g, "\\'")}', ${p.preco_produto || p.preco || 0})">
              🛒 Carrinho
            </button>
            <button class="btn btn-success btn-sm" onclick="comprarDireto(${id}, '${nome.replace(/'/g, "\\'")}')">
              Comprar
            </button>
          </div>
        </div>
      `;
      
      return div;
    }

    // ==================== CARRINHO (sessionStorage) ====================
    
    function getCarrinho() {
      try {
        return JSON.parse(sessionStorage.getItem('carrinho')) || [];
      } catch {
        return [];
      }
    }

    function setCarrinho(items) {
      sessionStorage.setItem('carrinho', JSON.stringify(items));
    }

    function adicionarCarrinho(id, nome, preco) {
      const items = getCarrinho();
      // Estrutura padronizada: {id, nome, preco, quantidade}
      const idx = items.findIndex(i => i.id === id);
      
      if (idx >= 0) {
        items[idx].quantidade += 1;
      } else {
        items.push({
          id: id,
          nome: nome,
          preco: Number(preco),
          quantidade: 1
        });
      }
      
      setCarrinho(items);
      toast('✓ Adicionado ao carrinho!');
      atualizarContadorCarrinho();
    }

    function atualizarContadorCarrinho() {
      const items = getCarrinho();
      const total = items.reduce((sum, item) => sum + item.quantidade, 0);
      // Atualizar badge se existir
      const badge = document.querySelector('.carrinho-badge');
      if (badge) badge.textContent = total;
    }

    async function comprarDireto(id, nome) {
      if (!_usuarioCache) {
        toast('Faça login para comprar', 'warning');
        setTimeout(() => window.location.href = '/login/login.html', 1500);
        return;
      }

      if (_usuarioCache.tipo === 'funcionario') {
        toast('Funcionários devem usar o sistema de pedidos', 'warning');
        return;
      }

      if (!confirm(`Confirma a compra de "${nome}"?`)) return;

      try {
        const res = await fetch(API_BASE_URL + '/pedido/comprar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ id_produto: id, quantidade: 1 })
        });

        const data = await res.json();

        if (!res.ok) {
          toast(data.error || 'Erro ao comprar', 'danger');
          return;
        }

        toast(`✓ Compra realizada! Pedido #${data.id_pedido}`, 'success');
      } catch (e) {
        toast('Erro de conexão', 'danger');
        console.error(e);
      }
    }

    // ==================== TOAST ====================
    
    function toast(msg, type = 'success') {
      let box = document.getElementById('toast-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toast-box';
        document.body.appendChild(box);
      }
      
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      box.appendChild(el);
      
      setTimeout(() => el.classList.add('show'), 10);
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // ==================== INIT ====================
    carregarUsuario();
  </script>
</body>
</html>
