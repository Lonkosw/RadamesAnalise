<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habib Perfume Shop - Menu Principal</title>
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/menu.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="/menu">🏠 Home</a></li>
        </ul>
      </nav>

      <div class="usuario-info">
        <span id="nomeUsuario">Carregando...</span>
        <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Layout com sidebar de filtros -->
    <div class="catalogo-layout">
      <!-- Sidebar de Filtros -->
      <aside class="filtros-sidebar" id="filtrosSidebar">
        <h3 class="filtros-titulo">🏷️ Filtrar por Marca</h3>
        <div id="filtrosMarcas" class="filtros-lista">
          <p class="text-muted">Carregando marcas...</p>
        </div>
        <button class="btn btn-sm btn-secondary" id="btnLimparFiltros" style="margin-top: 12px; width: 100%;">
          Limpar Filtros
        </button>
      </aside>
      
      <!-- Catálogo de Produtos -->
      <section class="catalogo">
        <h2 class="sec-title">🌹 Nossos Perfumes</h2>
        <div id="produtosGrid" class="produtos-grid-agrupado">
          <p class="text-muted text-center">Carregando produtos...</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <!-- Toast -->
  <div id="toast-box"></div>

  <!-- Modal Notas Olfativas - Minimalista -->
  <div id="modalNotasOverlay" class="modal-notas-overlay">
    <div class="modal-notas-container">
      <div class="modal-notas-header">
        <span id="modalNotasTitle">Notas Olfativas</span>
        <button type="button" id="modalNotasClose" class="modal-notas-close">&times;</button>
      </div>
      <img id="modalNotasImg" class="modal-notas-img" src="" alt="Notas Olfativas">
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3001';
    const navMenu = document.getElementById('navMenu');
    const grid = document.getElementById('produtosGrid');
    const filtrosMarcas = document.getElementById('filtrosMarcas');
    
    // Cache de dados
    let todosProdutos = [];
    let todasMarcas = [];
    let marcasSelecionadas = new Set();

    // ==================== MENUS ====================
    
    // Menu do CLIENTE
    const MENU_CLIENTE = [
      { label: '🏠 Home', href: '/menu' },
      { label: '🛒 Carrinho <span id="cart-badge" class="carrinho-badge">0</span>', href: '/visaoCliente/carrinho/carrinho.html' },
      { label: '📦 Meus Pedidos', href: '/visaoCliente/pedidos/pedidos.html' }
    ];

    // Menu do GERENTE (somente CRUDs permitidos)
    const MENU_GERENTE = [
      { label: '🏠 Home', href: '/menu' },
      { label: '🛒 Carrinho <span id="cart-badge" class="carrinho-badge">0</span>', href: '/pedido/abrirCarrinhoGerente' },
      { label: '📦 Meus Pedidos', href: '/visaoCliente/pedidos/pedidos.html' },
      { 
        label: '⚙️ Cadastros', 
        submenu: [
          { label: '👥 Gestão de Pessoas', href: '/pessoa/abrirCrudPessoa' },
          { label: '📋 Cargos', href: '/cargo/abrirCrudCargo' },
          { label: '🏷️ Marcas', href: '/marca/abrirCrudMarca' },
          { label: '🧴 Produtos', href: '/produto/abrirCrudProduto' },
          { label: '📦 Pedidos', href: '/pedido/abrirCrudPedido' }
        ]
      },
      { 
        label: '📊 Relatórios', 
        submenu: [
          { label: '📈 Vendas por Período', href: '/relatorios/index.html' },
          { label: '🏆 Produtos Mais Vendidos', href: '/relatorios/index.html' }
        ]
      }
    ];

    // ==================== RENDER MENU ====================
    
    function renderMenu(usuario) {
      navMenu.innerHTML = '';
      
      let menuItems = [];
      
      if (!usuario) {
        menuItems = [{ label: '🏠 Home', href: '/menu' }];
      } else if (usuario.tipo === 'cliente') {
        menuItems = MENU_CLIENTE;
      } else if (usuario.tipo === 'funcionario') {
        menuItems = MENU_GERENTE;
      }

      menuItems.forEach(item => {
        const li = document.createElement('li');
        
        if (item.submenu) {
          li.innerHTML = `<a href="#">${item.label}</a>`;
          const ul = document.createElement('ul');
          ul.className = 'nav-submenu';
          item.submenu.forEach(sub => {
            const subLi = document.createElement('li');
            subLi.innerHTML = `<a href="${sub.href}">${sub.label}</a>`;
            ul.appendChild(subLi);
          });
          li.appendChild(ul);
        } else {
          li.innerHTML = `<a href="${item.href}">${item.label}</a>`;
        }
        
        navMenu.appendChild(li);
      });

      // Atualiza nome do usuário
      const nomeEl = document.getElementById('nomeUsuario');
      if (usuario) {
        nomeEl.textContent = `Olá, ${usuario.nome || usuario.tipo}`;
      } else {
        nomeEl.textContent = 'Visitante';
      }
      
      // Atualiza contador do carrinho após render do menu
      setTimeout(() => atualizarContadorCarrinho(), 0);
    }

    // ==================== AUTENTICAÇÃO ====================
    
    let _usuarioCache = null;

    async function carregarUsuario() {
      try {
        const res = await fetch(API_BASE_URL + '/login/status', { credentials: 'include' });
        const data = await res.json();
        
        if (data.status === 'ok') {
          _usuarioCache = data.usuario;
          renderMenu(_usuarioCache);
          carregarProdutos();
        } else {
          window.location.href = '/login/login.html';
        }
      } catch (e) {
        console.error('Erro ao verificar login:', e);
        window.location.href = '/login/login.html';
      }
    }

    function logout() {
      document.cookie = 'usuarioLogado=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      window.location.href = '/login/login.html';
    }

    // ==================== PRODUTOS ====================
    
    async function carregarMarcas() {
      try {
        const r = await fetch(API_BASE_URL + '/marca');
        if (!r.ok) return;
        todasMarcas = await r.json();
        renderizarFiltrosMarcas();
      } catch (e) {
        console.error('Erro ao carregar marcas:', e);
      }
    }
    
    function renderizarFiltrosMarcas() {
      if (!filtrosMarcas) return;
      
      filtrosMarcas.innerHTML = todasMarcas.map(m => `
        <label class="filtro-checkbox">
          <input type="checkbox" value="${m.id_marca}" onchange="toggleFiltroMarca(${m.id_marca})">
          <span>${m.nome_marca}</span>
        </label>
      `).join('');
    }
    
    window.toggleFiltroMarca = function(idMarca) {
      if (marcasSelecionadas.has(idMarca)) {
        marcasSelecionadas.delete(idMarca);
      } else {
        marcasSelecionadas.add(idMarca);
      }
      renderizarProdutosAgrupados();
    };
    
    document.getElementById('btnLimparFiltros')?.addEventListener('click', () => {
      marcasSelecionadas.clear();
      const checkboxes = filtrosMarcas?.querySelectorAll('input[type="checkbox"]');
      checkboxes?.forEach(cb => cb.checked = false);
      renderizarProdutosAgrupados();
    });
    
    async function carregarProdutos() {
      try {
        // Carregar marcas e produtos em paralelo
        await carregarMarcas();
        
        const r = await fetch(API_BASE_URL + '/produto');
        if (!r.ok) return;
        todosProdutos = await r.json();
        
        renderizarProdutosAgrupados();
      } catch (e) {
        console.error('Erro ao carregar produtos:', e);
        grid.innerHTML = '<p class="text-danger text-center">Erro ao carregar produtos</p>';
      }
    }
    
    function renderizarProdutosAgrupados() {
      grid.innerHTML = '';
      
      // Filtrar produtos se houver marcas selecionadas
      let produtosFiltrados = todosProdutos;
      if (marcasSelecionadas.size > 0) {
        produtosFiltrados = todosProdutos.filter(p => 
          marcasSelecionadas.has(p.marca_id_marca)
        );
      }
      
      if (produtosFiltrados.length === 0) {
        grid.innerHTML = '<p class="text-muted text-center" style="grid-column:1/-1;">Nenhum produto encontrado</p>';
        return;
      }
      
      // Agrupar produtos por marca
      const grupos = {};
      produtosFiltrados.forEach(p => {
        const nomeMarca = p.nome_marca || 'Outros';
        if (!grupos[nomeMarca]) {
          grupos[nomeMarca] = [];
        }
        grupos[nomeMarca].push(p);
      });
      
      // Ordenar marcas alfabeticamente (com "Outros" por último)
      const marcasOrdenadas = Object.keys(grupos).sort((a, b) => {
        if (a === 'Outros') return 1;
        if (b === 'Outros') return -1;
        return a.localeCompare(b);
      });
      
      // Renderizar cada grupo
      marcasOrdenadas.forEach(nomeMarca => {
        const secaoMarca = document.createElement('div');
        secaoMarca.className = 'marca-secao';
        
        secaoMarca.innerHTML = `<h2 class="marca-titulo">🏷️ ${nomeMarca}</h2>`;
        
        const gridProdutos = document.createElement('div');
        gridProdutos.className = 'produtos-grid';
        
        grupos[nomeMarca].forEach(p => {
          gridProdutos.appendChild(cardProduto(p));
        });
        
        secaoMarca.appendChild(gridProdutos);
        grid.appendChild(secaoMarca);
      });
    }

    function cardProduto(p) {
      const div = document.createElement('div');
      div.className = 'produto-card';
      
      const id = p.id_produto;
      const nome = p.nome_produto || p.nome || 'Sem nome';
      const preco = Number(p.preco_produto || p.preco || 0).toFixed(2).replace('.', ',');
      // Priorizar nome_marca (FK) sobre marca_produto (texto livre)
      const marca = p.nome_marca || p.marca_produto || p.marca || '';
      const volume = p.volume_ml ? `${p.volume_ml} ml` : '';
      const concentracao = p.concentracao || '';
      const temNotas = p.notas_olfativas_imagem ? true : false;
      
      // Usar view-image para buscar imagem dinamicamente
      const imgSrc = `/view-image/${id}?t=${Date.now()}`;
      
      div.innerHTML = `
        <div class="produto-img">
          <img src="${imgSrc}" alt="${nome}" onerror="this.src='/imagens-produtos/default.png'">
        </div>
        <div class="produto-info">
          <h3 class="produto-nome" title="${nome}">${nome}</h3>
          <p class="produto-meta">${[marca, concentracao].filter(Boolean).join(' • ') || '&nbsp;'}</p>
          <p class="produto-volume">${volume}</p>
          <div class="produto-preco">R$ ${preco}</div>
          <div class="produto-acoes">
            ${temNotas ? `<button class="btn btn-outline btn-sm btn-notas-card" onclick="abrirModalNotasVitrine(${id}, '${nome.replace(/'/g, "\\'")}')">🔮 Notas</button>` : ''}
            <button class="btn btn-primary btn-sm" onclick="adicionarCarrinho(${id}, '${nome.replace(/'/g, "\\'")}', ${p.preco_produto || p.preco || 0}, '${marca.replace(/'/g, "\\'")}')">
              🛒 Carrinho
            </button>
          </div>
        </div>
      `;
      
      return div;
    }

    // ==================== CARRINHO (sessionStorage) ====================
    
    function getCarrinho() {
      try {
        return JSON.parse(localStorage.getItem('carrinho')) || [];
      } catch {
        return [];
      }
    }

    function setCarrinho(items) {
      localStorage.setItem('carrinho', JSON.stringify(items));
    }

    function adicionarCarrinho(id, nome, preco, marca) {
      const items = getCarrinho();
      // Estrutura padronizada: {id, nome, preco, marca, quantidade}
      const idx = items.findIndex(i => i.id === id);
      
      // Verificar estoque disponível
      const produto = todosProdutos.find(p => p.id_produto === id);
      const estoqueDisponivel = produto ? (produto.quantidade_estoque || 0) : 0;
      const quantidadeNoCarrinho = idx >= 0 ? items[idx].quantidade : 0;
      
      if (quantidadeNoCarrinho >= estoqueDisponivel) {
        toast(`⚠️ Estoque insuficiente! Disponível: ${estoqueDisponivel} unidade(s)`, 'warning');
        return;
      }
      
      if (idx >= 0) {
        items[idx].quantidade += 1;
      } else {
        items.push({
          id: id,
          nome: nome,
          preco: Number(preco),
          marca: marca || '',
          quantidade: 1
        });
      }
      
      setCarrinho(items);
      toast('✓ Adicionado ao carrinho!');
      atualizarContadorCarrinho();
    }

    function atualizarContadorCarrinho() {
      const items = getCarrinho();
      const total = items.reduce((sum, item) => sum + item.quantidade, 0);
      // Atualizar badge se existir
      const badge = document.getElementById('cart-badge');
      if (badge) {
        badge.textContent = total;
        badge.style.display = total > 0 ? 'inline-block' : 'none';
      }
    }

    async function comprarDireto(id, nome) {
      if (!_usuarioCache) {
        toast('Faça login para comprar', 'warning');
        setTimeout(() => window.location.href = '/login/login.html', 1500);
        return;
      }

      if (_usuarioCache.tipo === 'funcionario') {
        toast('Funcionários devem usar o sistema de pedidos', 'warning');
        return;
      }

      if (!confirm(`Confirma a compra de "${nome}"?`)) return;

      try {
        const res = await fetch(API_BASE_URL + '/pedido/comprar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ id_produto: id, quantidade: 1 })
        });

        const data = await res.json();

        if (!res.ok) {
          toast(data.error || 'Erro ao comprar', 'danger');
          return;
        }

        toast(`✓ Compra realizada! Pedido #${data.id_pedido}`, 'success');
      } catch (e) {
        toast('Erro de conexão', 'danger');
        console.error(e);
      }
    }

    // ==================== TOAST ====================
    
    function toast(msg, type = 'success') {
      let box = document.getElementById('toast-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toast-box';
        document.body.appendChild(box);
      }
      
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      box.appendChild(el);
      
      setTimeout(() => el.classList.add('show'), 10);
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // ==================== MODAL NOTAS OLFATIVAS ====================
    
    const modalNotasOverlay = document.getElementById('modalNotasOverlay');
    const modalNotasClose = document.getElementById('modalNotasClose');
    const modalNotasTitle = document.getElementById('modalNotasTitle');
    const modalNotasImg = document.getElementById('modalNotasImg');
    
    // Expor função no escopo global para onclick
    window.abrirModalNotasVitrine = function(produtoId, nomeProduto) {
      if(modalNotasTitle) modalNotasTitle.textContent = `Notas Olfativas – ${nomeProduto || 'Produto'}`;
      if(modalNotasImg) {
        modalNotasImg.src = `/view-notas/${produtoId}?t=${Date.now()}`;
        modalNotasImg.alt = `Notas Olfativas de ${nomeProduto}`;
        modalNotasImg.onerror = () => {
          modalNotasImg.src = '/imagens-notas/default-notas.png';
          modalNotasImg.onerror = null;
        };
      }
      if(modalNotasOverlay) modalNotasOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    };
    
    function fecharModalNotas() {
      if(modalNotasOverlay) modalNotasOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    
    // Event listeners do modal
    modalNotasClose?.addEventListener('click', fecharModalNotas);
    modalNotasOverlay?.addEventListener('click', (e) => {
      if(e.target === modalNotasOverlay) fecharModalNotas();
    });
    
    // Fechar modal com ESC
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && modalNotasOverlay?.classList.contains('active')){
        fecharModalNotas();
      }
    });

    // ==================== INIT ====================
    carregarUsuario();
  </script>
</body>
</html>
