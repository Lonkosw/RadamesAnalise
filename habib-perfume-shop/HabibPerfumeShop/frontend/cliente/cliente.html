<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Habib Perfume Shop</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="cliente.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      <nav class="header-nav">
        <a href="/menu">🏠 Início</a>
        <span class="usuario-info">
          <span id="nomeUsuario">Gerente</span>
          <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Título da página -->
    <div class="page-header">
      <h1>👥 Gerenciar Clientes</h1>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="f_q" class="form-control" placeholder="🔍 Buscar por nome ou email..." style="min-width: 250px;">
        <button id="btnBuscar" class="btn btn-primary">Buscar</button>
        <button id="btnLimparFiltro" class="btn btn-secondary">Limpar</button>
      </div>
      <div class="toolbar-right">
        <button id="btnNovo" class="btn btn-success">+ Novo Cliente</button>
        <button id="btnRecarregar" class="btn btn-secondary">↻ Atualizar</button>
      </div>
    </div>

    <!-- Feedback -->
    <div id="feedback" class="alert hidden"></div>

    <!-- Tabela -->
    <div class="table-container">
      <div class="table-responsive">
        <table class="table" id="tabela">
          <thead>
            <tr>
              <th>CPF</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Nascimento</th>
              <th>Renda</th>
              <th style="width: 120px; text-align: center;">Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dados dinâmicos -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulário -->
    <section id="secForm" class="card hidden" style="margin-top: 24px;">
      <div class="card-header">
        <h2 id="tituloForm">Novo Cliente</h2>
      </div>
      <div class="card-body">
        <form id="formRegistro" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label for="cpf">CPF <span class="required">*</span></label>
              <input type="text" id="cpf" name="cpf" class="form-control" maxlength="11" required pattern="\d{11}" placeholder="12345678901">
            </div>
            <div class="form-group">
              <label for="nome">Nome <span class="required">*</span></label>
              <input type="text" id="nome" name="nome" class="form-control" required placeholder="Nome completo">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="email">Email <span class="required">*</span></label>
              <input type="email" id="email" name="email" class="form-control" required placeholder="email@exemplo.com">
            </div>
            <div class="form-group">
              <label for="data_nascimento">Data de Nascimento</label>
              <input type="date" id="data_nascimento" name="data_nascimento" class="form-control">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="renda_cliente">Renda (R$)</label>
              <input type="number" id="renda_cliente" name="renda_cliente" class="form-control" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="form-group" id="senhaWrapper">
              <label for="senha">Senha <span class="required">*</span></label>
              <input type="password" id="senha" name="senha" class="form-control" required placeholder="••••••••">
            </div>
          </div>
          <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" class="btn btn-primary" id="btnSalvar">💾 Salvar</button>
            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
            <button type="button" class="btn btn-danger hidden" id="btnExcluir">🗑️ Excluir</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <script src="./cliente.js"></script>
</body>
</html>
