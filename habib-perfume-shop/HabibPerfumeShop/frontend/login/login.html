<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habib Perfume Shop - Login</title>
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/login/login.css">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-header">
        <h1>🌸 Habib Perfume Shop</h1>
        <p>Bem-vindo de volta!</p>
      </div>

      <div class="tab-buttons">
        <button id="btnLogin" class="tab-btn active" onclick="alternar('login')">Entrar</button>
        <button id="btnCadastro" class="tab-btn" onclick="alternar('cadastro')">Cadastrar</button>
      </div>

      <!-- Área de Login -->
      <div id="areaLogin" class="form-area active">
        <p class="form-title">Login Universal</p>
        <div class="form-group">
          <label for="loginEmailUniversal">E-mail</label>
          <input type="email" id="loginEmailUniversal" class="form-control" placeholder="seu@email.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" onclick="loginUniversal()">Entrar</button>
        <small class="form-hint">Use o email cadastrado (cliente ou funcionário)</small>
        <a href="../recuperar/recuperar.html" class="forgot-password-link">Esqueci minha senha</a>
      </div>

      <!-- Área de Cadastro -->
      <div id="areaCadastro" class="form-area">
        <p class="form-title">Criar nova conta</p>
        <div class="form-group">
          <label for="cadastroCpf">CPF</label>
          <input type="text" id="cadastroCpf" class="form-control" placeholder="12345678901" maxlength="11" required>
        </div>
        <div class="form-group">
          <label for="cadastroNome">Nome completo</label>
          <input type="text" id="cadastroNome" class="form-control" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label for="cadastroEmail">E-mail</label>
          <input type="email" id="cadastroEmail" class="form-control" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="cadastroSenha">Senha</label>
          <input type="password" id="cadastroSenha" class="form-control" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary btn-block" onclick="cadastrarCliente()">Cadastrar</button>
      </div>
      
      <div id="msg" class="message"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3001';

    function alternar(area) {
      document.querySelectorAll('.form-area').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (area === 'login') {
        document.getElementById('areaLogin').classList.add('active');
        btnLogin.classList.add('active');
      } else {
        document.getElementById('areaCadastro').classList.add('active');
        btnCadastro.classList.add('active');
      }
      limparMensagem();
    }

    function setMensagem(texto, ok = false) {
      const d = document.getElementById('msg');
      d.className = 'message ' + (ok ? 'message-success' : 'message-error');
      d.textContent = texto;
    }
    
    function limparMensagem(){ 
      const d = document.getElementById('msg');
      d.className = 'message';
      d.textContent = '';
    }

    async function loginUniversal(){
      limparMensagem();
      const email = loginEmailUniversal.value.trim();
      const senha = loginSenha.value.trim();
      if(!email || !senha){ setMensagem('Informe email e senha'); return; }
      try {
        const r = await fetch(API_BASE_URL + '/login/universal', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({ email, senha })
        });
        let data; try { data = await r.json(); } catch { setMensagem('Resposta inválida'); return; }
        if(r.ok && data.status==='ok'){
          const t = data.usuario.tipo === 'funcionario' ? (data.usuario.gerente? 'Gerente':'Funcionário') : 'Cliente';
          setMensagem('Login '+t+' ok. Redirecionando...', true);
          setTimeout(()=> window.location.href = API_BASE_URL + '/menu', 600);
        } else {
          setMensagem(data.mensagem || data.message || 'Credenciais inválidas');
        }
      } catch (e){
        setMensagem('Erro de rede');
      }
    }

    async function cadastrarCliente() {
      const cpf = document.getElementById('cadastroCpf').value.trim();
      const nome = document.getElementById('cadastroNome').value.trim();
      const email = document.getElementById('cadastroEmail').value.trim();
      const senha = document.getElementById('cadastroSenha').value.trim();

      if (!cpf || !nome || !email || !senha) {
        setMensagem('Preencha todos os campos');
        return;
      }

      if (!/^\d{11}$/.test(cpf)) {
        setMensagem('CPF deve ter 11 dígitos numéricos');
        return;
      }

      try {
        const res = await fetch(API_BASE_URL + '/login/cadastrarCliente', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ cpf, nome, email, senha })
        });
        let data; try { data = await res.json(); } catch { setMensagem('Resposta inválida', false); return; }
        if (res.ok && data.status === 'ok') {
          setMensagem('Cadastro realizado! Redirecionando...', true);
          setTimeout(()=> window.location.href = API_BASE_URL + '/menu', 700);
        } else {
          setMensagem(data.mensagem || data.message || 'Erro no cadastro');
        }
      } catch (e){
        setMensagem('Erro de rede no cadastro');
      }
    }

    // Verificar se deve mostrar cadastro
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('cadastro') === 'true') {
      alternar('cadastro');
    }
  </script>
</body>
</html>
