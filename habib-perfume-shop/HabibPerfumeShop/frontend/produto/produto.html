<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Produtos</title>
  <link rel="stylesheet" href="../common/crud.css" />
  <script type="module" defer src="./produto.js"></script>
  <script src="../common/simpleHeader.js" defer></script>
</head>
<body>
  <div class="h-container">
    <div class="page-title"><h1>Produtos</h1><span class="badge" id="totalBadge">0</span></div>
    <div class="toolbar">
      <input id="fBusca" placeholder="Buscar (nome/descrição)" />
      <input id="fMin" type="number" placeholder="Min Preço" />
      <input id="fMax" type="number" placeholder="Max Preço" />
      <button id="btnFiltrar">Filtrar</button>
      <button id="btnLimpar" class="secondary">Limpar</button>
      <button id="btnNovo">Novo</button>
    </div>
    <div id="lista"></div>
    <form class="crud-form" id="formProduto">
      <label>ID <input name="id_produto" readonly /></label>
      <label>Nome * <input name="nome" required /></label>
      <label>Marca <input name="marca" /></label>
      <label>Volume (ml) <input name="volume_ml" type="number" /></label>
      <label>Concentração <input name="concentracao" /></label>
      <label>Preço * <input name="preco" type="number" step="0.01" required /></label>
      <label>Estoque * <input name="quantidade_estoque" type="number" required /></label>
      <label style="grid-column:1/-1">Descrição <textarea name="descricao"></textarea></label>
      <label>Imagem (PNG)
        <div class="img-field">
          <input type="file" id="inpImagem" accept="image/png" />
          <div class="thumb-wrapper">
            <img id="previewImg" alt="preview" />
            <span class="placeholder" id="imgPlaceholder">Selecionar arquivo PNG...</span>
          </div>
        </div>
      </label>
      <button type="submit" class="submit">Salvar</button>
      <div id="fb" class="feedback"></div>
    </form>
  </div>
  <style>
    .img-field{display:flex;flex-direction:column;gap:6px}
    #inpImagem{padding:4px;border:1px solid #ccc;border-radius:4px;background:#fff;font-size:.85rem}
    .thumb-wrapper{position:relative;width:140px;height:140px;border:1px dashed #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f9f9f9}
    .thumb-wrapper img{max-width:100%;max-height:100%;display:none;object-fit:cover}
    .thumb-wrapper .placeholder{position:absolute;font-size:.70rem;color:#666;text-align:center;padding:4px;pointer-events:none}
    .thumb-wrapper.has-image{border-style:solid}
    .thumb-wrapper.has-image img{display:block}
    .thumb-wrapper.has-image .placeholder{display:none}
  </style>
</body>
</html>
