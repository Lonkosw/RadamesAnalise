<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Habib Perfume Shop</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="produto.css">
</head>
<body>
  <!-- Header Padrão -->
  <header class="header-padrao">
    <div class="header-content">
      <a href="/menu" class="logo">🌸 Habib Perfume Shop</a>
      <nav class="header-nav">
        <a href="/menu">🏠 Início</a>
        <span class="usuario-info">
          <span id="nomeUsuario">Gerente</span>
          <a href="#" onclick="logout()" class="btn btn-sm btn-outline">Sair</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
    <!-- Título da página -->
    <div class="page-header">
      <h1>🧴 Gerenciar Produtos</h1>
      <span class="badge badge-primary" id="totalBadge">0 produtos</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="fBusca" class="form-control" placeholder="🔍 Buscar por nome ou descrição..." style="min-width: 200px;">
        <input type="number" id="fMin" class="form-control" placeholder="Preço mín" style="width: 110px;">
        <input type="number" id="fMax" class="form-control" placeholder="Preço máx" style="width: 110px;">
        <button id="btnFiltrar" class="btn btn-primary">Filtrar</button>
        <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
      </div>
      <div class="toolbar-right">
        <button id="btnNovo" class="btn btn-success">+ Novo Produto</button>
      </div>
    </div>

    <!-- Lista de Produtos -->
    <div id="lista" class="produtos-lista"></div>

    <!-- Formulário -->
    <section id="secForm" class="card hidden" style="margin-top: 24px;">
      <div class="card-header">
        <h2 id="tituloForm">Novo Produto</h2>
      </div>
      <div class="card-body">
        <form id="formProduto" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label for="id_produto">ID</label>
              <input type="text" name="id_produto" id="id_produto" class="form-control" readonly>
            </div>
            <div class="form-group">
              <label for="nome">Nome <span class="required">*</span></label>
              <input type="text" name="nome" id="nome" class="form-control" required placeholder="Nome do produto">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="marca">Marca</label>
              <input type="text" name="marca" id="marca" class="form-control" placeholder="Marca do produto">
            </div>
            <div class="form-group">
              <label for="volume_ml">Volume (ml)</label>
              <input type="number" name="volume_ml" id="volume_ml" class="form-control" placeholder="100">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="concentracao">Concentração</label>
              <input type="text" name="concentracao" id="concentracao" class="form-control" placeholder="Eau de Parfum">
            </div>
            <div class="form-group">
              <label for="preco">Preço (R$) <span class="required">*</span></label>
              <input type="number" name="preco" id="preco" class="form-control" step="0.01" required placeholder="0.00">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="quantidade_estoque">Estoque <span class="required">*</span></label>
              <input type="number" name="quantidade_estoque" id="quantidade_estoque" class="form-control" required placeholder="0">
            </div>
            <div class="form-group">
              <label for="inpImagem">Imagem (PNG)</label>
              <input type="file" id="inpImagem" class="form-control" accept="image/png">
            </div>
          </div>
          <div class="form-group" style="grid-column: 1/-1;">
            <label for="descricao">Descrição</label>
            <textarea name="descricao" id="descricao" class="form-control" rows="3" placeholder="Descrição detalhada do produto..."></textarea>
          </div>
          <div class="form-group">
            <label>Preview da Imagem</label>
            <div class="img-preview">
              <img id="previewImg" alt="Preview">
              <span id="imgPlaceholder">Nenhuma imagem selecionada</span>
            </div>
          </div>
          <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">💾 Salvar</button>
            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            <button type="button" id="btnExcluir" class="btn btn-danger" hidden>🗑️ Excluir</button>
          </div>
        </form>
        <div id="fb" class="alert hidden" style="margin-top: 16px;"></div>
      </div>
    </section>
  </main>

  <!-- Footer Padrão -->
  <footer class="footer-padrao">
    <p>&copy; 2025 Habib Perfume Shop - Todos os direitos reservados</p>
  </footer>

  <script type="module" src="./produto.js"></script>
</body>
</html>
